name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME#v}
          V=$(jq -r .version dist/manifest.json)
          [ "$TAG" = "$V" ] || { echo "tag $TAG != manifest $V"; exit 1; }

      - name: Zip
        run: |
          cd dist && zip -r ../extension-${{ github.ref_name }}.zip . && cd ..
          sha256sum extension-*.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            extension-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
